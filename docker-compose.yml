version: '3.9'

services:
  db:
    image: mariadb:11.4
    container_name: mariadb-wisataku
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wisataku_db
    ports:
      - '3306:3306'
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
